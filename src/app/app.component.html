<app-header></app-header>
<main>
  <ul id="users">

    <li>
      <!-- we can pass the input to custom and take output from custom the name should be same in both places,and whatever value we emit from there, here we can collect it in $event -->
      <app-user [id]="users[0].id" [avatar]="users[0].avatar" [name]="users[0].name"
        (selectUser)="onSelectUser($event)" />
    </li>

    <li>
      <app-user [id]="users[1].id" [avatar]="users[1].avatar" [name]="users[1].name"

        (selectUser)="onSelectUser($event)" />
    </li>

    <li>
      <app-user [id]="users[4].id" [avatar]="users[4].avatar" [name]="users[4].name"
        (selectUser)="onSelectUser($event)" />

    <li>
