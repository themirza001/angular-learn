<section id="tasks">
    <header>
        <h2>{{selectedUserName}}'s Tasks</h2>
        <menu>
            <button>Add Task</button>
        </menu>
    </header>

    <ul>
        @for(task of currUserTasks;track task.id){
        <li>
            <app-task [task]="task" (completedTaskId)="onTaskCompletion($event)"></app-task>
        </li>
        }
    </ul>
</section>
